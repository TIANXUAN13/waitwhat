name: Docker Publish

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '手动发布时的镜像标签（仅支持 V 开头，例如 V1234）'
        required: false
        default: ''
      push_latest:
        description: '是否附带 latest 标签'
        required: false
        default: 'false'

env:
  IMAGE_NAME: waitwhat

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.image_tag, 'V') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.push_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
