services:
  waitwhat:
    image: 2926930231/waitwhat:latest
    container_name: waitwhat
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_DATA_DIR: /app/data
      APP_WEB_DIR: /app/web
      APP_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - ./data:/app/data
